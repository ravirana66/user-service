jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Application
        run: mvn clean package

      - name: Get Maven Version
        run: |
          echo "APP_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ravirana66/user-service:${APP_VERSION} \
            -t ravirana66/user-service:latest .

      - name: Push Docker Image
        run: |
          docker push ravirana66/user-service:${APP_VERSION}
          docker push ravirana66/user-service:latest