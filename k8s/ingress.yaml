apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: production-ingress
  namespace: production

spec:
  ingressClassName: nginx

  rules:
#    - host: local

     - http:
        paths:
          - path: /users
            pathType: Prefix

            backend:
              service:
                name: user-service
                port:
                  number: 80